aid: linqgg
name: Linq.gg
description: 'LinQ is the wallet, payments and loyalty platform operated by Galactica
  Games, Inc. (dba Toffee) for game developers building loyalty programs, real-money
  gaming (RMG) and branded debit-card experiences. Games integrate a LinQ Wallet account
  for each player, then deposit, withdraw, transfer and reconcile funds against internal
  game currencies. The LinQ Wallet Public API is a gRPC / Protocol Buffers surface
  published on the Buf Schema Registry as buf.build/linq/linq, organised into Geo
  (IP and coordinate restriction checks), Auth (anonymous game sign-in and wallet-linked
  user sign-in), Money (accounts, balances, replenishment orders, transfers, Brazil
  Pix, operations history) and Sandbox (integration-test helpers) modules. Client
  libraries are generated from the registry for TypeScript, JavaScript and other targets,
  and a first-party Unity SDK handles PCI-compliant native card and Apple Pay checkout
  on device.'
