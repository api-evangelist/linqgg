shared_rules:
- Amounts are integers in coins; divide by 100 before display.
- idempotency_key is a request-message field, not a header, and is required on
  PutMoney and GetMoney.
- Money operations are geo-gated; check IsAccessAllowed and IsOperationAllowed first.
- There is no event or webhook surface; asynchronous outcomes are polled.
- Never route raw card data through a game backend.
