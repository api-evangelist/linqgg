agent_safety_notes:
- Eleven of these tools move real money. Any MCP deployment should require explicit
  human confirmation for tools flagged moves_money, and must supply a caller-stable
  idempotency_key on put_money, get_money and new_transfer_order so a retried tool
  call cannot double-spend.
- Amounts are integers in coins and must be divided by 100 for display. An agent
  reading a balance of 500 must report $5.00, not $500.
- Money operations are geo-gated. check_access_by_ip and check_operation_allowed
  should be called before any moves_money tool.
