syntax = "proto3";

package linq.geo.operations.v1;

option java_multiple_files = true;
option java_outer_classname = "GeoOperationsProto";
option java_package = "games.galactica.services.api";
option objc_class_prefix = "LAPI";

// Operation types for access checking
enum OperationType {

  // Putting money via replenishment within card or apple pay
  depositing = 0;

  // Getting money from game to wallet for further
  // sending to card or bank account
  withdrawal = 1;
}

// Array of data generated by devices (iOS)
// and on which service are deternimes in which
// region user is currently localed
message Coordinates {
  optional float accuracy = 1;
  optional float altitude = 2;
  optional float altitudeAccuracy = 3;
  optional int32 heading = 4;
  // Required field with latitude
  float latitude = 5;
  // Required field with longitude
  float longitude = 6;
  optional int32 speed = 7;
}

// Payload with an access request
message AccessRequest {
  // Operation type, see enum for details
  OperationType operation = 1;
  // User device current coordinates
  optional Coordinates coordinates = 2;
  // Optional code of an application
  optional string application = 3;
  // Optional device profiling session id
  optional string session = 4;
}

// User location determamined based on coordinates
message UserLocation {
  // Two-letter country code
  string country = 1;
  // Two-letter region code, for US it is a state code
  string region = 2;
  // Name of location, like town or city
  string city = 3;
}

// Response payload with an access status
message Access {
  // Boolean flag that shows is operation allowed or not
  bool allowed = 1;
  // Determined user location based on coordinates
  UserLocation location = 2;
  // Currency or game id for which access rules applied
  string currency = 3;
}

// Service for checking access to requested operation
service LocationService {
  // checks based on internal rules and user
  // location is requested operation allowed
  rpc IsOperationAllowed(AccessRequest) returns (Access) {};
}
