description: >-
  LinQ publishes no prose versioning, deprecation or SLA policy. What it does
  publish is machine-readable: protobuf package versioning and explicit
  `option deprecated = true` markers in the .proto files on the Buf Schema
  Registry. This artifact records the observable lifecycle posture.
versioning:
  scheme: protobuf package version segment
  pattern: <domain>.<module>.v<N>
  published_policy: false
  observed_practice: >-
    A breaking revision ships as a new versioned package published alongside the
    old one. Both remain resolvable from the registry; consumers migrate by
    changing the import path.
  stability_statement: >-
    "The full implementation and description of the API Reference is still in
    progress and requires some work on our part, but there are no plans to change
    the method signatures." — https://docs.linq.gg/getting-started
  current_versions:
    linq.auth.game: v1
    linq.auth.user: v1
    linq.geo.operations: v1
    linq.geo.restrictions: v2
    linq.money.accounts: v2
    linq.money.operations: v1
    linq.money.payments: v1
    linq.sandbox.helpers: v1
